name: Rebuild dev server

on:
  workflow_dispatch:
    inputs:
      note:
        description: Optional note for this rebuild
        required: false
        type: string

jobs:
  rebuild-dev:
    runs-on: [self-hosted, Linux, X64, baked-superiorsix]
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild and start baked-superiorsix
        env:
          DOCKER_BUILDKIT: "1"
          COMPOSE_DOCKER_CLI_BUILD: "1"
          BAKED_AUTH_CLIENT_GIT_TOKEN: ${{ secrets.BAKED_AUTH_CLIENT_GIT_TOKEN }}
          SUPERIORSIX_JWT_SECRET_KEY: ${{ secrets.AUTH_JWT_SECRET_KEY }}
          SUPERIORSIX_ENVIRONMENT: development
        run: |
          echo "Dispatch note: ${{ inputs.note }}"
          docker compose -p baked-superiorsix up -d --build --wait --remove-orphans
          docker compose -p baked-superiorsix ps
