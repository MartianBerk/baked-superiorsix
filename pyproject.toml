[project]
name = "baked-superiorsix"
version = "0.1.0"
description = "Superior Six game API (modern supersix)."
authors = [
    { name = "Martin" }
]
readme = "README.md"
requires-python = ">=3.12.3,<3.13"
dependencies = [
    "fastapi[standard]>=0.119.0",
    "pydantic-settings>=2.11.0",
    "pyjwt[crypto]>=2.10.0",
    "sqlalchemy[asyncio]>=2.0.40",
    "aiosqlite>=0.21.0",
]

[project.scripts]
baked-superiorsix = "baked.superiorsix.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=1.2.0",
    "httpx>=0.28.0",
    "ruff>=0.13.0",
    "cryptography>=44.0.0",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "baked", from = "src" }]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--import-mode=importlib"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
